<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tlin7 – Social Links</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f9fafb;
            color: #111827;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 2rem;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
            max-width: 400px;
        }

        .link {
            text-decoration: none;
            padding: 1rem;
            border-radius: 12px;
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            color: #1f2937;
            font-weight: 600;
            text-align: center;
            transition: all 0.2s ease;
        }

        .link:hover {
            background: #e5e7eb;
        }

        footer {
            margin-top: 2rem;
            font-size: 0.875rem;
            color: #6b7280;
        }
    </style>
</head>
<body>
<h1>@tlin7 – My Socials</h1>
<div class="links">
    <a class="link" href="https://github.com/tlin7" target="_blank">GitHub</a>
    <a class="link" href="https://linkedin.com/in/tlin7" target="_blank">LinkedIn</a>
    <a class="link" href="https://twitter.com/tlin7" target="_blank">Twitter</a>
    <a class="link" href="https://instagram.com/tlin7" target="_blank">Instagram</a>
</div>
<footer>
    Built with ❤️ and GitHub Pages
</footer>
</body>
</html>

  <!--
    TV/desktop version: redirect straight to the real stream source.

    The ntv.cx/embed page is only a wrapper that iframes embed.st inside it.
    On some TV browsers (e.g. Google TV) embed.st sees it's framed and shows a
    "remove sandbox attributes" notice. Pointing directly at the embed.st URL
    as the top-level page removes every layer of framing, so there's nothing to
    sandbox and it runs fullscreen.

    Update this URL each day to the current event (grab it from the ntv player:
    inspect -> the <iframe id="streamIframe"> src is the embed.st link).
  -->
  <meta http-equiv="refresh" content="0; url=https://embed.st/embed/admin/ppv-san-antonio-spurs-vs-new-york-knicks/1">

    html, body { margin: 0; height: 100%; background: #000; color: #fff;

    a { color: #6cf; }
  </style>
  <script>
    location.replace("https://embed.st/embed/admin/ppv-san-antonio-spurs-vs-new-york-knicks/1");
  </script>
</head>
